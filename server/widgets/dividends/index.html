<div class="bg-slate-800 rounded-xl shadow-sm widget-dividends p-6 w-full">
  <div class="flex justify-between items-center mb-0">
    <h2 class="text-lg font-bold text-white flex items-center gap-2">
      Dividends
      <button id="dividendsMinimizeBtn" class="ml-2 text-slate-400 hover:text-blue-400 focus:outline-none" title="Minimize Dividends" style="transition: transform 0.2s;"><i id="dividendsMinimizeIcon" class="fa-solid fa-chevron-down"></i></button>
    </h2>
  </div>
  <div id="dividendsContent" class="collapsed">
    <div class="mb-4 text-gray-400">Track your received dividends here.</div>
    
    <!-- Received Dividends Section -->
    <div class="mb-6">
      <h3 class="text-md font-semibold text-white mb-1">Received Dividends</h3>
      <div class="overflow-x-auto overflow-y-auto max-h-96">
        <table class="w-full text-sm">
          <thead class="bg-slate-800 sticky top-0 z-10">
            <tr class="border-b border-slate-700">
              <th class="text-left px-3 py-2 text-gray-400">Symbol</th>
              <th class="text-left px-3 py-2 text-gray-400">Amount</th>
              <th class="text-left px-3 py-2 text-gray-400">Record Date</th>
              <th class="text-left px-3 py-2 text-gray-400">Payable Date</th>
              <th class="text-left px-3 py-2 text-gray-400">Actions</th>
            </tr>
          </thead>
          <tbody id="receivedDividendsTbody">
            <tr><td colspan="5" class="text-center text-gray-400 py-4">No received dividends.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
