<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231e293b'/><text x='16' y='24' text-anchor='middle' font-size='20' fill='%2334d399'>$</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
<style>
/* ═══════════════ Design System — CSS Custom Properties ═══════════════ */
:root {
  --color-bg: #0f172a;
  --color-surface: #1e293b;
  --color-surface-hover: #263348;
  --color-surface-elevated: #334155;
  --color-surface-inset: #0f172a;
  --color-text-primary: #f1f5f9;
  --color-text-secondary: #94a3b8;
  --color-text-tertiary: #64748b;
  --color-accent: #3b82f6;
  --color-accent-hover: #60a5fa;
  --color-accent-subtle: rgba(59,130,246,0.12);
  --color-success: #22c55e;
  --color-success-subtle: rgba(34,197,94,0.12);
  --color-warning: #f59e0b;
  --color-warning-subtle: rgba(245,158,11,0.12);
  --color-error: #ef4444;
  --color-error-subtle: rgba(239,68,68,0.12);
  --color-info: #3b82f6;
  --color-border: rgba(255,255,255,0.06);
  --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Fira Mono', monospace;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.04);
  --shadow-elevated: 0 4px 12px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

/* Custom scrollbar — thin, dark, matches site theme */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
::-webkit-scrollbar-corner { background: transparent; }
/* Firefox */
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }
html, body { height: 100%; }
body { background: var(--color-bg); color: var(--color-text-primary); font-family: var(--font-sans); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ═══════════════ Layout ═══════════════ */
.app { display: flex; flex-direction: column; min-height: 100vh; }
.header { background: var(--color-surface); border-bottom: 1px solid var(--color-border); padding: var(--space-4) var(--space-6); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); }
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: var(--space-2); }
.header .sub { color: var(--color-text-tertiary); font-size: 13px; }
.header .status-area { display: flex; gap: var(--space-4); align-items: center; }
.connection-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #ef4444; transition: all .3s ease; flex-shrink: 0; margin-top:1px; }
.connection-dot.connected { background: var(--color-success); box-shadow: 0 0 6px rgba(34,197,94,0.7); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

.main-content { flex: 1; padding: var(--space-6); max-width: 85rem; margin: 0 auto; width: 100%; }

/* ═══════════════ Footer ═══════════════ */
.footer { padding: var(--space-4) var(--space-6); border-top: 1px solid var(--color-border); background: var(--color-surface); text-align: center; color: var(--color-text-tertiary); font-size: 13px; }

/* ═══════════════ Buttons ═══════════════ */
.btn { display: inline-flex; align-items: center; gap: var(--space-2); padding: 8px 16px; border-radius: var(--radius-lg); font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all .15s ease; font-family: var(--font-sans); }
.btn-primary { background: var(--color-accent); color: white; }
.btn-primary:hover { background: var(--color-accent-hover); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-success { background: #16a34a; color: white; }
.btn-success:hover { background: #15803d; }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { background: #b91c1c; }
.btn-ghost { background: transparent; color: var(--color-text-secondary); padding: 6px 10px; border-radius: var(--radius-md); }
.btn-ghost:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: var(--radius-md); }
.btn-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); border: none; cursor: pointer; background: transparent; color: var(--color-text-tertiary); transition: all .15s ease; }
.btn-icon:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }

/* ═══════════════ Cards ═══════════════ */
.card { background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: var(--space-5); margin-bottom: var(--space-4); }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
.card-header h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: var(--space-2); }

/* ═══════════════ Tables ═══════════════ */
.table-wrap { overflow-x: auto; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--color-text-tertiary); padding: 10px 12px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--color-accent); }
.symbol-cell { display: flex; flex-direction: column; line-height: 1.2; max-width: 150px; }
.symbol-name { font-weight: 600; font-size: 13px; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.symbol-notes { font-size: 10.5px; color: var(--color-text-tertiary); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.03); }
tr:hover td { background: rgba(255,255,255,0.02); }
tr:last-child td { border-bottom: none; }
.text-green { color: var(--color-success); }
.text-red { color: var(--color-error); }
.text-yellow { color: var(--color-warning); }
.text-muted { color: var(--color-text-tertiary); }

/* ═══════════════ Forms ═══════════════ */
input, select, textarea { background: var(--color-surface-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary); padding: 8px 12px; border-radius: var(--radius-md); font-size: 14px; font-family: var(--font-sans); width: 100%; outline: none; transition: border .15s ease; }
input:focus, select:focus, textarea:focus { border-color: var(--color-accent); }
label { display: block; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: var(--space-1); }
.form-group { margin-bottom: var(--space-4); }
.form-row { display: flex; gap: var(--space-3); }
.form-row > * { flex: 1; }

/* ═══════════════ Modals ═══════════════ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: var(--space-4); }
.modal { background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-elevated); padding: var(--space-6); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-5); }
.modal-header h3 { font-size: 18px; font-weight: 700; }

/* ═══════════════ Toast ═══════════════ */
.toast-container { position: fixed; top: var(--space-5); right: var(--space-5); z-index: 100; display: flex; flex-direction: column; gap: var(--space-2); }
.toast { padding: 12px 18px; border-radius: var(--radius-lg); box-shadow: var(--shadow-elevated); display: flex; align-items: center; gap: var(--space-3); font-size: 14px; font-weight: 500; min-width: 280px; max-width: 420px; animation: toastIn .3s ease-out; }
.toast-success { background: #166534; border-left: 4px solid var(--color-success); }
.toast-error { background: #991b1b; border-left: 4px solid var(--color-error); }
.toast-warning { background: #92400e; border-left: 4px solid var(--color-warning); }
.toast-info { background: #1e3a5f; border-left: 4px solid var(--color-accent); }
.toast .close { margin-left: auto; cursor: pointer; opacity: .7; }
.toast .close:hover { opacity: 1; }
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ═══════════════ Hero/Landing ═══════════════ */
.hero { position: relative; overflow: hidden; background: linear-gradient(to bottom right, #0f172a, #1e293b, #0f172a); padding: 80px 0; text-align: center; }
.hero-bg { position: absolute; inset: 0; }
.hero-bg div { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .1; }
.hero-bg .b1 { top: 80px; left: 40px; width: 288px; height: 288px; background: #22c55e; animation: pulse 4s ease-in-out infinite; }
.hero-bg .b2 { bottom: 80px; right: 40px; width: 384px; height: 384px; background: #3b82f6; animation: pulse 4s ease-in-out infinite 1s; }
.hero-bg .b3 { top: 50%; left: 50%; transform: translate(-50%,-50%); width: 320px; height: 320px; background: #a855f7; animation: pulse 4s ease-in-out infinite 2s; }
.hero-content { position: relative; z-index: 10; max-width: 85rem; margin: 0 auto; padding: 0 var(--space-6); }
.hero h1 { font-size: clamp(2rem,5vw,4rem); font-weight: 800; margin-bottom: var(--space-5); line-height: 1.2; }
.hero h1 span { background: linear-gradient(to right, #22c55e, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero p { font-size: clamp(1rem,2vw,1.25rem); color: var(--color-text-secondary); max-width: 48rem; margin: 0 auto var(--space-8); line-height: 1.6; }
.hero p span { color: var(--color-success); font-weight: 600; }
.hero-cta { display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap; }
.features { padding: 80px 0; background: var(--color-surface); }
.features h2 { font-size: 2rem; font-weight: 700; text-align: center; margin-bottom: var(--space-4); }
.features .subtitle { text-align: center; color: var(--color-text-secondary); font-size: 1.125rem; margin-bottom: var(--space-8); max-width: 36rem; margin-left: auto; margin-right: auto; }
.features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--space-6); max-width: 85rem; margin: 0 auto; padding: 0 var(--space-6); }
.feature-card { background: var(--color-surface-elevated); border-radius: var(--radius-xl); padding: var(--space-8); transition: all .2s ease; cursor: default; }
.feature-card:hover { transform: scale(1.03); }
.feature-icon { width: 64px; height: 64px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-6); font-size: 24px; color: white; }
.feature-card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: var(--space-4); }
.feature-card p { color: var(--color-text-secondary); line-height: 1.6; }
.stats { padding: 80px 0; display: grid; grid-template-columns: repeat(2,1fr); gap: var(--space-6); max-width: 85rem; margin: 0 auto; padding-left: var(--space-6); padding-right: var(--space-6); }
@media (min-width: 768px) { .stats { grid-template-columns: repeat(4,1fr); } }
.stat { text-align: center; }
.stat-value { font-size: 2rem; font-weight: 700; margin-bottom: var(--space-1); }
.stat-label { color: var(--color-text-tertiary); }

/* ═══════════════ User Menu ═══════════════ */
.user-menu-wrap { position: relative; }
.user-menu { position: absolute; right: 0; top: calc(100% + 8px); width: 220px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-elevated); z-index: 50; padding: var(--space-2); }
.user-menu-item { display: flex; align-items: center; gap: var(--space-3); padding: 10px 12px; width: 100%; text-align: left; border: none; background: none; color: var(--color-text-primary); font-size: 14px; cursor: pointer; border-radius: var(--radius-md); font-family: var(--font-sans); }
.user-menu-item:hover { background: var(--color-surface-hover); }
.user-menu-item i { width: 16px; text-align: center; color: var(--color-text-tertiary); }

/* ═══════════════ Widget Mini/Collapse ═══════════════ */
.widget-content { transition: max-height .3s ease, opacity .3s ease; overflow: hidden; }
.widget-content.collapsed { max-height: 0; opacity: 0; padding: 0; margin: 0; }
.widget-content.expanded { max-height: 10000px; opacity: 1; }
.minimize-btn { cursor: pointer; color: var(--color-text-tertiary); transition: color .2s; }
.minimize-btn:hover { color: var(--color-accent); }

/* ═══════════════ Badges ═══════════════ */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.badge-rh { background: rgba(34,197,94,0.15); color: var(--color-success); }
.badge-crypto { background: rgba(234,179,8,0.15); color: #eab308; }
.badge-btc { background: rgba(234,179,8,0.15); color: #eab308; }

/* ═══════════════ Spinner ═══════════════ */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════ Toggle Switch ═══════════════ */
.toggle-switch { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; font-size: 13px; color: var(--color-text-secondary); user-select: none; }
.toggle-switch input[type="checkbox"] { display: none; }
.toggle-track { width: 36px; height: 20px; background: var(--color-surface-elevated); border-radius: 10px; border: 1px solid var(--color-border); position: relative; transition: all .2s ease; flex-shrink: 0; }
.toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--color-text-tertiary); border-radius: 50%; transition: all .2s ease; }
.toggle-switch input:checked + .toggle-track { background: var(--color-accent); border-color: var(--color-accent); }
.toggle-switch input:checked + .toggle-track::after { left: 18px; background: white; }
.toggle-switch:hover .toggle-track { border-color: var(--color-text-tertiary); }

/* ═══════════════ Symbol Dropdown ═══════════════ */
.symbol-dropdown { position: absolute; z-index: 50; width: 100%; margin-top: 2px; max-height: 220px; overflow-y: auto; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-elevated); }
.symbol-option { padding: var(--space-2) var(--space-3); cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
.symbol-option:hover, .symbol-option.highlight { background: var(--color-accent-subtle); }
.symbol-option .sym { font-weight: 600; }
.symbol-option .name { color: var(--color-text-tertiary); font-size: 12px; }

/* ═══════════════ Mobile Responsive (412px Pixel 9 and under) ═══════════════ */
@media (max-width: 640px) {
  .header { padding: var(--space-2) var(--space-3); gap: var(--space-2); flex-wrap: nowrap; }
  .header h1 { font-size: 16px; }
  .header .status-area { gap: var(--space-2); white-space: nowrap; flex-shrink: 0; }
  .header .sub { font-size: 11px; display: none; }
  .main-content { padding: var(--space-3); }
  .card { padding: var(--space-3); }
  .card-header { flex-direction: column; align-items: flex-start; gap: var(--space-2); }
  .card-header .flex.items-center.gap-2 { flex-wrap: wrap; }
  .modal { max-width: calc(100vw - 24px); padding: var(--space-4); margin: var(--space-2); }
  .modal-header h3 { font-size: 16px; }
  .modal-header .btn-icon { width: 32px; height: 32px; }
  .form-row { flex-direction: column; gap: var(--space-2); }
  .filters-panel { max-width: 100%; }
  .report-layout { flex-direction: column; }
  .footer { padding: var(--space-2) var(--space-3); flex-direction: column; gap: var(--space-1); text-align: center; }
  .toast-container { right: var(--space-2); top: var(--space-2); left: var(--space-2); }
  .toast { min-width: 0; max-width: 100%; font-size: 13px; padding: 10px 14px; }
  .btn { font-size: 13px; padding: 6px 12px; }
  .btn-sm { font-size: 11px; padding: 3px 8px; }
  .btn-icon { width: 32px; height: 32px; font-size: 14px; }
  table { font-size: 12px; }
  th, td { padding: 5px 6px; }
  th { font-size: 10px; }
  .user-menu { right: 0; left: auto; width: 200px; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: var(--space-3); padding-left: var(--space-3); padding-right: var(--space-3); }
  .features-grid { grid-template-columns: 1fr; padding: 0 var(--space-3); }
  .hero { padding: 40px 0; }
  .hero-content { padding: 0 var(--space-3); }
  .features { padding: 40px 0; }
  .stats { padding: 40px 0; }
  .symbol-dropdown { width: 100%; }
  .settings-overlay { padding-top: var(--space-4); }
  .settings-panel { width: calc(100vw - 16px); max-width: 100%; max-height: 85vh; }
  .hero-cta .btn { font-size: 14px !important; padding: 10px 20px !important; }
  .pl-summary-grid { grid-template-columns: 1fr !important; gap: var(--space-2) !important; }
  .card-header .flex.gap-1 { flex-wrap: wrap; }
  td .flex.gap-1 { flex-wrap: wrap; }
  .card-header .btn-icon { width: 28px; height: 28px; font-size: 12px; }
}

/* ═══════════════ Misc ═══════════════ */
.loading-state, .error-state { text-align: center; padding: 32px; }
.loading-state { color: var(--color-text-tertiary); }
.error-state { color: var(--color-error); }
.error-state .retry { margin-top: var(--space-3); }
.text-center { text-align: center; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-2 { gap: var(--space-2); }
.gap-3 { gap: var(--space-3); }
.gap-4 { gap: var(--space-4); }
.mt-2 { margin-top: var(--space-2); }
.mt-4 { margin-top: var(--space-4); }
.mb-2 { margin-bottom: var(--space-2); }
.mb-4 { margin-bottom: var(--space-4); }
.w-full { width: 100%; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sticky-top { position: sticky; top: 0; z-index: 5; background: var(--color-surface); }
.uppercase { text-transform: uppercase; }
.text-xs { font-size: 11px; }
.text-sm { font-size: 13px; }
.text-lg { font-size: 16px; }

/* ═══════════════ Report Filters Panel ═══════════════ */
.filters-panel { width: 100%; max-width: 320px; flex-shrink: 0; }
@media (min-width: 1024px) { .filters-panel { max-width: 300px; } }
.report-layout { display: flex; flex-direction: column; gap: var(--space-4); }
@media (min-width: 1024px) { .report-layout { flex-direction: row; } }
</style>
</head>
<body>
<div x-data="app()" class="app">
  <!-- Toast Container -->
  <template x-teleport="body">
    <div class="toast-container" x-data="{}">
      <template x-for="t in $store.toast.list" :key="t.id">
        <div class="toast" :class="'toast-' + t.type">
          <i x-show="t.type==='success'" class="fa-solid fa-check-circle"></i>
          <i x-show="t.type==='error'" class="fa-solid fa-triangle-exclamation"></i>
          <i x-show="t.type==='warning'" class="fa-solid fa-exclamation-circle"></i>
          <i x-show="t.type==='info'" class="fa-solid fa-circle-info"></i>
          <span x-text="t.message"></span>
          <i class="fa-solid fa-xmark close" @click="$store.toast.remove(t.id)"></i>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══════════════ LANDING PAGE ═══════════════ -->
  <template x-if="currentView === 'landing'">
    <div style="display:flex;flex-direction:column;flex:1;min-height:0">
      <header class="header">
        <div class="flex items-center gap-3">
          <a href="/" class="flex items-center gap-3">
            <img src="/icons/logo-32x32.png" alt="" class="w-8 h-8" onerror="this.style.display='none'">
            <h1>Finance Dashboard</h1>
          </a>
        </div>
        <div class="flex items-center gap-3">
          <button class="btn btn-primary" @click="showLoginModal = true">
            <i class="fa-solid fa-sign-in-alt"></i> Login
          </button>
        </div>
      </header>

      <div class="hero">
        <div class="hero-bg">
          <div class="b1"></div>
          <div class="b2"></div>
          <div class="b3"></div>
        </div>
        <div class="hero-content">
          <h1><span>Trade Like a Pro</span></h1>
          <p>Transform from intermediate to professional trader with institutional-grade tools. <span>Built by retail, for retail — no hidden information.</span></p>
          <div class="hero-cta">
            <a href="/create-account" @click.prevent="navigate('/create-account')" class="btn btn-success" style="font-size:16px;padding:14px 32px">

                      <div class="text-xs text-muted">Shares/Yr</div>
                    </div>
                    <div style="background:var(--color-surface-elevated);border-radius:var(--radius-md);padding:var(--space-2);text-align:center">
                      <div style="font-size:1.1rem;font-weight:700" x-text="dcaYearPct.toFixed(1) + '%'"></div>
                      <div class="text-xs text-muted">vs Current</div>
                    </div>
                  </div>
                </div>

                <!-- DCA Simulator -->
                <div style="margin-bottom:var(--space-4);padding:var(--space-3);background:var(--color-surface-elevated);border-radius:var(--radius-lg)">
                  <h3 style="font-size:13px;font-weight:600;margin-bottom:var(--space-3)">DCA Simulator</h3>
                  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-3)">
                    <div>
                      <label class="text-xs text-muted">Daily Investment</label>
                      <input type="number" x-model="dcaDaily" step="10" min="0" style="width:100%;padding:6px 8px;font-size:12px">
                    </div>
                    <div>
                      <label class="text-xs text-muted">Target Price</label>
                      <input type="number" x-model="dcaTargetPrice" step="1" min="1" style="width:100%;padding:6px 8px;font-size:12px">
                    </div>
                    <div>
                      <label class="text-xs text-muted">Days</label>
                      <input type="number" x-model="dcaDays" step="30" min="7" style="width:100%;padding:6px 8px;font-size:12px">
                    </div>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)">
                    <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:var(--space-2);text-align:center">
                      <div style="font-weight:600;font-size:13px" x-text="fmtCurrency(dcaTotalInvested)"></div>
                      <div class="text-xs text-muted">Invested</div>
                    </div>
                    <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:var(--space-2);text-align:center">
                      <div style="font-weight:600;font-size:13px" x-text="dcaSimShares.toFixed(2)"></div>
                      <div class="text-xs text-muted">Shares</div>
                    </div>
                    <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:var(--space-2);text-align:center">
                      <div style="font-weight:600;font-size:13px" :class="dcaSimFinalVal >= dcaTotalInvested ? 'text-green' : 'text-red'" x-text="fmtCurrency(dcaSimFinalVal)"></div>
                      <div class="text-xs text-muted">Value at Target</div>
                    </div>
                    <div style="background:var(--color-bg);border-radius:var(--radius-md);padding:var(--space-2);text-align:center">
                      <div style="font-weight:600;font-size:13px" :class="dcaSimProfit >= 0 ? 'text-green' : 'text-red'" x-text="fmtCurrency(dcaSimProfit)"></div>
                      <div class="text-xs text-muted">Projected Profit</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          </template>
        </div>

        <!-- Reports Widget -->
        <div class="card">
          <div class="card-header">
            <h2 @click="toggleWidget('reports')" style="cursor:pointer">
              Reports
              <i class="fa-solid minimize-btn" :class="widgetStates.reports.minimized ? 'fa-chevron-down' : 'fa-chevron-up'"></i>
            </h2>
            <div class="flex items-center gap-2" x-show="!widgetStates.reports.minimized">
              <button class="btn btn-danger btn-sm" @click="cleanResults()"><i class="fa-solid fa-trash"></i> Clean Results</button>
              <button class="btn btn-primary btn-sm" @click="openGenerateReportModal()"><i class="fa-solid fa-plus"></i> Generate Report</button>
            </div>
          </div>
          <div class="widget-content" :class="widgetStates.reports.minimized ? 'collapsed' : 'expanded'">
            <!-- Error Banner -->
            <div x-show="reportError" style="display:flex;align-items:start;gap:var(--space-3);background:rgba(239,68,68,0.1);border:1px solid #ef4444;border-radius:var(--radius-lg);padding:var(--space-3);margin-bottom:var(--space-4)" role="alert">
              <i class="fa-solid fa-triangle-exclamation text-red" style="margin-top:2px"></i>
              <div style="flex:1;min-width:0">
                <p style="font-weight:600;font-size:13px;color:#fca5a5">Report action failed</p>
                <p style="font-size:12px;color:#fecaca" x-text="reportError"></p>
              </div>
              <button class="btn-icon" @click="reportError=''" style="color:#fca5a5"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="report-layout">
              <!-- Filters -->
              <div class="card filters-panel" style="margin-bottom:0">
                <div class="flex items-center gap-2" style="margin-bottom:var(--space-4)"><i class="fa-solid fa-filter" style="color:var(--color-accent)"></i><h3 style="font-size:16px;font-weight:600">Filters</h3></div>
                <div class="form-group">
                  <label>Report Type</label>
                  <select x-model="reportFilters.type">
                    <option value="all">All Reports</option>
                    <option value="comparison">Comparison Reports</option>
                    <option value="backtest">Backtest Reports</option>
                    <option value="market">Market Check</option>
                    <option value="finance">Finance Report</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Symbol</label>
                  <select x-model="reportFilters.symbol">
                    <option value="all">All Symbols</option>
                    <template x-for="s in availableSymbols" :key="s"><option :value="s" x-text="s"></option></template>
                  </select>
                </div>
                <div class="form-group">
                  <label>Strategy</label>
                  <select x-model="reportFilters.strategy">
                    <option value="all">All Strategies</option>
                    <template x-for="s in availableStrategies" :key="s"><option :value="s" x-text="s"></option></template>
                  </select>
                </div>
                <div class="form-group">
                  <label>Start Date</label>
                  <input type="date" x-model="reportFilters.startDate">
                </div>
                <div class="form-group">
                  <label>End Date</label>
                  <input type="date" x-model="reportFilters.endDate">
                </div>
                <div style="display:flex;flex-direction:column;gap:var(--space-2)">
                  <button class="btn btn-ghost" @click="resetFilters()"><i class="fa-solid fa-rotate"></i> Reset</button>
                  <button class="btn btn-primary" @click="applyFilters()"><i class="fa-solid fa-filter"></i> Apply Filters</button>
                </div>
              </div>

              <!-- Reports Table -->
              <div class="card" style="flex:1;min-width:0;margin-bottom:0">
                <div class="flex items-center justify-between" style="margin-bottom:var(--space-4)">
                  <div class="flex items-center gap-2"><i class="fa-solid fa-table" style="color:var(--color-accent)"></i><h3 style="font-size:16px;font-weight:600">Available Reports</h3></div>
                  <div class="text-xs text-muted">Generated: <span x-text="new Date().toLocaleString()"></span></div>
                </div>
                <div class="table-wrap" style="height:550px">
                  <table>
                    <thead class="sticky-top"><tr><th>Actions</th><th>Symbol</th><th>Report Type</th><th>Strategy</th><th>Timeframe</th><th>Date Range</th><th>Created</th></tr></thead>
                    <tbody>
                      <template x-for="r in filteredReports" :key="r.id">
                        <tr>
                          <template x-if="r._is_generating">
                            <td colspan="7">
                              <div class="flex items-center gap-2" style="padding:4px 0;width:100%">
                                <span class="spinner" style="color:var(--color-accent);flex-shrink:0"></span>
                                <span style="color:var(--color-accent);font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                                  Generating <span x-text="r.reportType"></span> report for <span x-text="r.symbol"></span>
                                  <template x-if="r.strategy &amp;&amp; r.strategy !== '&mdash;'"> &mdash; Strategy: <span x-text="r.strategy"></span></template>
                                  <template x-if="r.timeframe &amp;&amp; r.timeframe !== '&mdash;'"> &mdash; <span x-text="r.timeframe"></span></template>
                                  <template x-if="r.dateRange &amp;&amp; r.dateRange !== '&mdash;' &amp;&amp; r.dateRange !== 'Latest snapshot'"> &mdash; <span x-text="r.dateRange"></span></template>
                                </span>
                                <span style="color:var(--color-warning);font-size:11px;font-family:var(--font-mono);flex-shrink:0;margin-left:auto">started <span x-text="fmtElapsed(generatingElapsed)"></span> ago</span>
                              </div>
                            </td>
                          </template>
                          <template x-if="!r._is_generating">
                            <>
                              <td><div class="flex gap-1"><button class="btn-icon" style="width:26px;height:26px;font-size:11px" @click="viewReport(r)" title="View"><i class="fa-solid fa-eye"></i></button><button class="btn-icon" style="width:26px;height:26px;font-size:11px" @click="deleteReport(r)"><i class="fa-solid fa-trash"></i></button></div></td>
                              <td x-text="r.symbol" style="font-weight:600"></td>
                              <td class="text-muted" x-text="r.reportType"></td>
                              <td class="text-muted" x-text="r.strategy"></td>
                              <td class="text-muted" x-text="r.timeframe"></td>
                              <td class="text-muted truncate" x-text="r.dateRange"></td>
                              <td class="text-muted" x-text="fmtDate(r.created)"></td>
                            </>
                          </template>
                        </tr>
                      </template>
                      <tr x-show="filteredReports.length===0">
                        <td colspan="7" class="text-center text-muted">No reports found.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer" style="display:flex;justify-content:space-between;align-items:center">
        <span>&copy; 2026 Finance Dashboard. <span style="color:var(--color-text-tertiary)">v1.0.0</span></span>
        <span x-show="lastUpdated" style="font-size:12px">Last update: <span x-text="lastUpdated"></span></span>
        <span x-show="!lastUpdated" style="font-size:12px;color:var(--color-text-tertiary)">Awaiting data...</span>
      </footer>
    </div>
  </template>

  <!-- ═══════════════ NOT FOUND / SERVER DOWN ═══════════════ -->
  <template x-if="currentView === 'not-found'">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:var(--space-6)">
      <div style="font-size:80px;margin-bottom:var(--space-4)">🔍</div>
      <h1 style="font-size:2rem;font-weight:700;margin-bottom:var(--space-3)">Page Not Found</h1>
      <p style="color:var(--color-text-tertiary);margin-bottom:var(--space-6)">The page you're looking for doesn't exist.</p>
      <a href="/" @click.prevent="navigate('/')" class="btn btn-primary">Go Home</a>
    </div>
  </template>

  <template x-if="currentView === 'server-down'">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:var(--space-6)">
      <div style="font-size:80px;margin-bottom:var(--space-4)">⚠️</div>
      <h1 style="font-size:2rem;font-weight:700;margin-bottom:var(--space-3)">Server Error</h1>
      <p style="color:var(--color-text-tertiary);margin-bottom:var(--space-6)">The server encountered an error. Please try again later.</p>
      <a href="/" @click.prevent="navigate('/')" class="btn btn-primary">Try Again</a>
    </div>
  </template>

  <!-- ═══════════════ ADD POSITION MODAL ═══════════════ -->
  <div x-show="showPosModal" class="modal-overlay" @click="showPosModal = false">
    <div class="modal" @click.stop>
      <div class="modal-header">
        <h3 x-text="editingPos ? 'Edit Position' : 'Add Position'"></h3>
        <button class="btn-icon" @click="showPosModal = false"><i class="fa-solid fa-times"></i></button>
      </div>
      <form @submit.prevent="savePosition">
        <div class="form-group">
          <label for="posSymbol">Symbol</label>
          <input type="text" id="posSymbol" x-model="posForm.symbol" required autocomplete="off" style="text-transform:uppercase;letter-spacing:0.5px">
        </div>
        <div class="form-group">
          <label for="posAmount">Amount ($)</label>
          <input type="number" id="posAmount" x-model="posForm.amount" step="any" required>
        </div>
        <div class="form-group">
          <label for="posBuyPrice">Avg Buy Price</label>
          <input type="number" id="posBuyPrice" x-model="posForm.avg_buy_price" step="any" required>
        </div>
        <div class="form-group">
          <label for="posNotes">Notes</label>
          <textarea id="posNotes" x-model="posForm.notes" rows="2"></textarea>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" class="btn btn-ghost" @click="showPosModal = false">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════ SETTINGS MODAL ═══════════════ -->
  <div x-show="showSettingsModal" class="modal-overlay" @click="showSettingsModal = false">
    <div class="modal" @click.stop>
      <div class="modal-header">
        <h3>Portfolio Settings</h3>
        <button class="btn-icon" @click="showSettingsModal = false"><i class="fa-solid fa-times"></i></button>
      </div>
      <!-- Syncing overlay — centered on screen, not modal -->
      <div x-show="syncStatus === 'running'" class="modal-overlay" style="position:fixed;z-index:60">
        <div style="background:var(--color-surface-elevated);padding:var(--space-5);border-radius:var(--radius-lg);text-align:center;min-width:280px">
          <p style="font-weight:600;margin-bottom:var(--space-2)">Syncing Market Data</p>
          <div class="flex items-center justify-center gap-2" style="margin-bottom:var(--space-2)"><span class="spinner" style="color:var(--color-accent);width:20px;height:20px;border-width:3px"></span><span class="text-sm" x-text="syncProgress"></span></div>
          <p style="font-size:13px;color:var(--color-text-tertiary)" x-text="fmtElapsed(syncElapsed)"></p>
        </div>
      </div>
      <form @submit.prevent="saveSettings">
        <h4 style="font-size:14px;font-weight:600;margin-bottom:var(--space-3)">Portfolio</h4>
        <div class="form-group">
          <label style="color:var(--color-success);font-weight:600">Total Portfolio Cash ($)</label>
          <input type="text" x-model="settingsForm.cash" step="1" min="0" inputmode="numeric">
        </div>
        <div class="form-group">
          <label style="color:#eab308;font-weight:600">Total Portfolio BTC ($)</label>
          <input type="text" x-model="settingsForm.btc_dollar" step="any" min="0" inputmode="decimal">
        </div>
        <div class="form-group">
          <label style="color:#eab308;font-weight:600">BTC Avg Buy Price ($)</label>
          <input type="text" x-model="settingsForm.btc_avg_price" step="any" min="0" inputmode="decimal">
        </div>

        <h4 style="font-size:14px;font-weight:600;margin-bottom:var(--space-3);margin-top:var(--space-5)">Robinhood Integration</h4>
        <div class="form-group" style="display:flex;align-items:center;gap:var(--space-2)">
          <input type="checkbox" id="rhEnabled" x-model="settingsForm.robinhood_enabled" style="width:auto">
          <label for="rhEnabled" style="margin:0">Enable Robinhood Integration</label>
        </div>
        <div x-show="settingsForm.robinhood_enabled">
          <div class="form-group">
            <label>Username</label>
            <input type="email" x-model="settingsForm.robinhood_username" placeholder="Enter Robinhood email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" x-model="settingsForm.robinhood_password" placeholder="Enter Robinhood password">
          </div>
          <div class="form-group">
            <label>MFA Code (Optional)</label>
            <input type="text" x-model="settingsForm.robinhood_mfa" placeholder="Enter MFA code if enabled">
          </div>
          <div class="form-group">
            <button type="button" class="btn btn-primary w-full" @click="syncFromSettings()" :disabled="syncStatus === 'running'">
              <span x-show="syncStatus === 'running'"><span class="spinner" style="margin-right:6px"></span></span>
              <span x-text="syncStatus === 'running' ? syncProgress : 'Sync Market Data'"></span>
            </button>
          </div>
        </div>
        <hr style="border:0;border-top:1px solid var(--color-border);margin:var(--space-4) 0">
        <div class="flex justify-end gap-2">
          <button type="button" class="btn btn-ghost" @click="showSettingsModal = false" :disabled="syncStatus === 'running'">Cancel</button>
          <button type="submit" class="btn btn-primary" :disabled="syncStatus === 'running'">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════ PORTFOLIO VIEW SETTINGS MODAL ═══════════════ -->
  <div x-show="showPortfolioViewSettings" class="modal-overlay" @click="showPortfolioViewSettings = false">
    <div class="modal" @click.stop style="max-width:420px">
      <div class="modal-header">
        <h3><i class="fa-solid fa-cog" style="margin-right:8px;color:var(--color-text-tertiary)"></i> Portfolio View Settings</h3>
        <button class="btn-icon" @click="showPortfolioViewSettings = false"><i class="fa-solid fa-times"></i></button>
      </div>

      <div style="margin-bottom:var(--space-5)">
        <h4 style="font-size:13px;font-weight:600;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:var(--space-3)">Column Visibility</h4>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)">
          <label class="toggle-switch">
            <input type="checkbox" x-model="portfolioViewSettings.columns.symbol" disabled>
            <span class="toggle-track"></span>
            <span>Symbol</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" x-model="portfolioViewSettings.columns.notes">
            <span class="toggle-track"></span>
            <span>Notes</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" x-model="portfolioViewSettings.columns.avgBuyPrice">
            <span class="toggle-track"></span>
            <span>Avg Buy Price</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" x-model="portfolioViewSettings.columns.percent">
            <span class="toggle-track"></span>
            <span>% of Portfolio</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" x-model="portfolioViewSettings.columns.todaysReturn">
            <span class="toggle-track"></span>
            <span>Today's Return ($)</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" x-model="portfolioViewSettings.columns.totalReturn">
            <span class="toggle-track"></span>
            <span>Total Return ($)</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" x-model="portfolioViewSettings.columns.totalReturnPct">
            <span class="toggle-track"></span>
            <span>Total Return %</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" x-model="portfolioViewSettings.columns.marketValue">
            <span class="toggle-track"></span>
            <span>Market Value</span>
          </label>
        </div>
      </div>

      <div style="margin-bottom:var(--space-5)">
        <h4 style="font-size:13px;font-weight:600;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:var(--space-3)">Default Sort</h4>
        <div class="form-group">
          <label>Sort Column</label>
          <select x-model="portfolioViewSettings.defaultSortCol">
            <option value="percent">% of Portfolio</option>
            <option value="total_return">Total Return ($)</option>
            <option value="todays_return">Today's Return ($)</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Sort Direction</label>
          <select x-model="portfolioViewSettings.defaultSortDir">
            <option value="desc">Descending (high to low)</option>
            <option value="asc">Ascending (low to high)</option>
          </select>
        </div>
      </div>

      <hr style="border:0;border-top:1px solid var(--color-border);margin:var(--space-4) 0">
      <div class="flex justify-end gap-2">
        <button type="button" class="btn btn-ghost" @click="showPortfolioViewSettings = false">Close</button>
        <button type="button" class="btn btn-primary" @click="savePortfolioViewSettings()">Save</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ ADD ORDER MODAL ═══════════════ -->
  <div x-show="showOrderModal" class="modal-overlay" @click="showOrderModal = false">
    <div class="modal" @click.stop>
      <div class="modal-header">
        <h3 x-text="editingOrder ? 'Edit Order' : 'Add Order'"></h3>
        <button class="btn-icon" @click="showOrderModal = false"><i class="fa-solid fa-times"></i></button>
      </div>
      <form @submit.prevent="saveOrder">
        <input type="hidden" x-model="orderForm.id">
        <div class="form-group">
          <label>Symbol</label>
          <input type="text" x-model="orderForm.symbol" required autocomplete="off" style="text-transform:uppercase;letter-spacing:0.5px">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select x-model="orderForm.type" required>
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
            <option value="dividend">Dividend</option>
          </select>
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" x-model="orderForm.quantity" step="any" required>
        </div>
        <div class="form-group">
          <label>Buy Price</label>
          <input type="number" x-model="orderForm.buy_price" step="any">
        </div>
        <div class="form-group">
          <label>Sell Price</label>
          <input type="number" x-model="orderForm.sell_price" step="any">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" x-model="orderForm.date" required>
        </div>
        <div class="form-group">
          <label>P/L</label>
          <input type="number" x-model="orderForm.profit_loss" step="any">
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" class="btn btn-ghost" @click="showOrderModal = false">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════ ADD DIVIDEND MODAL ═══════════════ -->
  <div x-show="showDivModal" class="modal-overlay" @click="showDivModal = false">
    <div class="modal" @click.stop>
      <div class="modal-header">
        <h3 x-text="editingDividend ? 'Edit Dividend' : 'Add Dividend'"></h3>
        <button class="btn-icon" @click="showDivModal = false"><i class="fa-solid fa-times"></i></button>
      </div>
      <form @submit.prevent="saveDividend">
        <div class="form-group">
          <label>Symbol</label>
          <input type="text" x-model="divForm.symbol" required autocomplete="off" style="text-transform:uppercase">
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" x-model="divForm.amount" step="any" required>
        </div>
        <div class="form-group">
          <label>Record Date</label>
          <input type="date" x-model="divForm.record_date" required>
        </div>
        <div class="form-group">
          <label>Payable Date</label>
          <input type="date" x-model="divForm.payable_date" required>
        </div>
        <div class="flex justify-end gap-2">

  <!-- ═══════════════ GENERATE REPORT MODAL ═══════════════ -->
  <div x-show="showGenReportModal" class="modal-overlay" @click="showGenReportModal = false">
    <div class="modal" @click.stop>

      </div>

          <p x-show="symbolSearchHint" style="font-size:11px;color:var(--color-warning);margin-top:4px"><i class="fa-solid fa-circle-exclamation"></i> <span x-text="symbolSearchHint"></span></p>
          <p x-show="symbolSearchError" style="font-size:11px;color:var(--color-error);margin-top:4px"><i class="fa-solid fa-triangle-exclamation"></i> <span x-text="symbolSearchError"></span></p>
