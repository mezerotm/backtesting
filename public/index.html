          <label>Strategy</label>
          <select x-model="genForm.strategy" required>
            <template x-for="s in validStrategies" :key="s.value">
              <option :value="s.value" x-text="s.label"></option>
            </template>
          </select>
        </div>
        <div class="form-group" x-show="showGenField('timeframe')">
          <label>Timeframe</label>
          <select x-model="genForm.timeframe">
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
          </select>
        </div>
        <div class="form-group" x-show="showGenField('startDate')">
          <label>Start Date</label>
          <input type="date" x-model="genForm.startDate">
        </div>
        <div class="form-group" x-show="showGenField('endDate')">
          <label>End Date</label>
          <input type="date" x-model="genForm.endDate">
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" class="btn btn-ghost" @click="showGenReportModal = false">Cancel</button>
          <button type="submit" class="btn btn-primary" :disabled="reportGenerating">
            <span x-show="reportGenerating"><span class="spinner" style="margin-right:6px"></span></span>
            <span x-text="reportGenerating ? 'Generating...' : 'Generate'"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// Alpine.js Store: Toast
// ════════════════════════════════════════════════════════════════
document.addEventListener('alpine:init', () => {
  Alpine.store('toast', {
    list: [],
    show(message, type = 'info', duration = 5000) {
      const id = Date.now() + Math.random()
      this.list.push({ id, message, type })
      if (this.list.length > 5) this.list.shift()
      if (duration > 0) setTimeout(() => this.remove(id), duration)
      return id
    },
    remove(id) {
      this.list = this.list.filter(t => t.id !== id)
    },
    removeAll() { this.list = [] }
  })
})

// ════════════════════════════════════════════════════════════════
// Helper functions
// ════════════════════════════════════════════════════════════════
function fmtCurrency(v) {
  if (v == null || isNaN(v)) return '$0.00'
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(v)
}
function fmtShares(v) {
  if (v == null || isNaN(v)) return '0'
  const s = v.toFixed(3)
  if (s.endsWith('.000')) return Math.round(v).toString()
  return v.toFixed(2)
}
function fmtPct(v) {
  if (v == null || isNaN(v)) return '0.00%'
  return v.toFixed(2) + '%'
}
function fmtDate(d) {
  if (!d) return ''
  const dt = new Date(String(d).replace(' ', 'T'))
  return isNaN(dt.getTime()) ? '' : dt.toLocaleDateString()
}
function fmtElapsed(secs) {
  const m = Math.floor(secs / 60), s = secs % 60
  return m > 0 ? m + 'm ' + s + 's' : s + 's'
}
function timeAgo(ts) {
  if (!ts) return ''
  const diff = Math.floor((Date.now() - ts) / 1000)
  if (diff < 60) return diff + 's ago'
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago'
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago'
  return Math.floor(diff / 86400) + 'd ago'
}
function toISODate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')
}

// ════════════════════════════════════════════════════════════════
// API helpers
// ════════════════════════════════════════════════════════════════
function getToken() { return localStorage.getItem('accessToken') }
function apiHeaders() {
  const h = { 'Content-Type': 'application/json' }
  const t = getToken()
  if (t) h['Authorization'] = 'Bearer ' + t
  return h
}
async function apiGet(url, timeoutMs = 30000) {
  const r = await fetch(url, { headers: apiHeaders(), credentials: 'include', signal: AbortSignal.timeout(timeoutMs) })
  if (!r.ok) {
    if (r.status === 401) localStorage.removeItem('accessToken')
    const d = await r.json().catch(() => ({}))
    throw new Error(d.detail || 'HTTP ' + r.status)
  }
  return r.json()
}
async function apiPost(url, data, timeoutMs = 30000) {
  const r = await fetch(url, { method: 'POST', headers: apiHeaders(), credentials: 'include', body: data ? JSON.stringify(data) : undefined, signal: AbortSignal.timeout(timeoutMs) })
  if (!r.ok) {
    if (r.status === 401) localStorage.removeItem('accessToken')
    const d = await r.json().catch(() => ({}))
    throw new Error(d.detail || 'HTTP ' + r.status)
  }
  return r.json()
}
async function apiPut(url, data, timeoutMs = 30000) {
  const r = await fetch(url, { method: 'PUT', headers: apiHeaders(), credentials: 'include', body: data ? JSON.stringify(data) : undefined, signal: AbortSignal.timeout(timeoutMs) })
  if (!r.ok) {
    const d = await r.json().catch(() => ({}))
    throw new Error(d.detail || 'HTTP ' + r.status)
  }
  return r.json()
}
async function apiDelete(url, timeoutMs = 30000) {
  const r = await fetch(url, { method: 'DELETE', headers: apiHeaders(), credentials: 'include', signal: AbortSignal.timeout(timeoutMs) })
  if (!r.ok) throw new Error('HTTP ' + r.status)
  return r.json()
}

// ════════════════════════════════════════════════════════════════
// Report type capabilities
// ════════════════════════════════════════════════════════════════
const REPORT_TYPE_CAPS = {
  market: { label: 'Market Check', available: true, fields: ['timeframe','startDate','endDate'] },
  finance: { label: 'Finance', available: true, fields: ['symbol','startDate','endDate'] },
  backtest: { label: 'Backtest', available: false, fields: ['symbol','strategy','startDate','endDate'] },
  comparison: { label: 'Comparison', available: false, fields: ['symbol','strategy','startDate','endDate'] }
}
const REPORT_TYPES = ['market','finance','backtest','comparison']
const VALID_STRATEGIES = [
  { value: 'BuyAndHoldStrategy', label: 'Buy & Hold' },
  { value: 'SimpleMovingAverageCrossover', label: 'SMA Crossover' },
  { value: 'ExponentialMovingAverageCrossover', label: 'EMA Crossover' },
  { value: 'MACDRSIStrategy', label: 'MACD-RSI-EMA' },
  { value: 'BollingerRSIStrategy', label: 'Bollinger RSI' },
  { value: 'CombinedStrategy', label: 'Combined' }
]

// ============================================================
// Load widget states from localStorage
// ============================================================
function loadWidgetStates() {
  try {
    const saved = localStorage.getItem('finance_widget_states')
    if (saved) return JSON.parse(saved)
  } catch (e) {}
  return {
    portfolio: { minimized: true },
    dividends: { minimized: true },
    profitLoss: { minimized: true },
    reports: { minimized: true }
  }
}
function saveWidgetStates(states) {
  try { localStorage.setItem('finance_widget_states', JSON.stringify(states)) } catch (e) {}
}

// ════════════════════════════════════════════════════════════════
// Main App Component (Alpine x-data)
// ════════════════════════════════════════════════════════════════
function app() {
  return {
    // ── Routing ──
    currentView: 'landing',
    async fetchAllData() {
      if (this.currentView !== 'dashboard') return
      await this.fetchPortfolio()
      /* orders/dividends/profitLoss are loaded inside fetchPortfolio via Promise.allSettled */
    },
    init() {
      // Determine initial route
      const path = window.location.pathname
      this.routeTo(path)

      // Auto-login check
      this.checkAuth()

      // Set up health check polling
      this.checkHealth()
      this._healthInterval = setInterval(() => this.checkHealth(), 30000)

      // Watch for dashboard view changes to load data
      this._viewWatch = setInterval(() => {
        if (this.currentView === 'dashboard' && !this._dataLoaded) {
          this._dataLoaded = true
          this.fetchAllData()
        }
      }, 300)

      // Set up periodic data refresh on dashboard
      this._syncInterval = setInterval(() => {
        if (this.currentView === 'dashboard') {
          this.fetchAllData()
        }
      }, 600000) // 10 min

      // Listen for portfolio settings event from header
      window.addEventListener('open-portfolio-settings', () => this.openSettingsModal())

      // Listen for popstate
      window.addEventListener('popstate', (e) => {
        this.routeTo(window.location.pathname)
      })

      // Load portfolio view settings from localStorage
      const savedView = localStorage.getItem('portfolioViewSettings')
      if (savedView) {
        try {
          const parsed = JSON.parse(savedView)
          this.portfolioViewSettings = parsed
          this.sortCol = parsed.defaultSortCol || 'amount'
          this.sortDir = parsed.defaultSortDir || 'desc'
        } catch (e) {}
      }
    },
    destroy() {
      if (this._healthInterval) clearInterval(this._healthInterval)
      if (this._syncInterval) clearInterval(this._syncInterval)
      this.stopSyncPolling()
    },
    routeTo(path) {
      // Map path to view
      const routes = {
        '/': 'dashboard',
        '/dashboard': 'dashboard',
        '/dashboard.html': 'dashboard',
        '/login': 'landing',
        '/landing.html': 'landing',
        '/create-account': 'create-account',
        '/create-account.html': 'create-account',
        '/server-down': 'server-down',
        '/server-down.html': 'server-down'
      }
      if (routes[path] !== undefined) {
        this.currentView = routes[path]
      } else {
        this.currentView = 'not-found'
      }
    },
    navigate(path) {
      window.history.pushState({}, '', path)
      this.routeTo(path)
    },

    // ── Auth ──
    authForm: { email: '', password: '', confirmPassword: '' },
    caForm: { name: '', email: '', password: '', confirmPassword: '', terms: false },
    authError: '',
    authLoading: false,
    showLoginModal: false,
    isRegistering: false,
    isAuthenticated: false,

    async checkAuth() {
      const stored = localStorage.getItem('accessToken')
      if (!stored) {
        // Try auto-login
        await this.autoLogin()
        return
      }
      try {
        const user = await apiGet('/api/auth/me')
        if (user && user.id) {
          this.isAuthenticated = true
          if (this.currentView === 'landing') this.navigate('/dashboard')
          // Auth confirmed — trigger data load; _viewWatch may have fired before auth was ready
          if (this.currentView === 'dashboard') {
            this.fetchAllData()
          }
        } else {
          this.isAuthenticated = false
        }
      } catch (err) {
        localStorage.removeItem('accessToken')
        await this.autoLogin()
      }
    },

    async autoLogin() {
      this.authLoading = true
      try {
        const resp = await apiPost('/api/auth/auto')
        if (resp && resp.access_token && resp.user && resp.user.id) {
          localStorage.setItem('accessToken', resp.access_token)
          this.isAuthenticated = true
          if (this.currentView === 'landing') this.navigate('/dashboard')
          // Auth just became available — trigger data load if on dashboard
          if (this.currentView === 'dashboard') {
            this._dataLoaded = false
            this.fetchAllData()
          }
        }
      } catch (err) {
        // Auto-login failed, stay on landing
      } finally {
        this.authLoading = false
      }
    },

    async handleAuthSubmit() {
      this.authLoading = true
      this.authError = ''
      try {
        if (this.isRegistering) {
          if (this.authForm.password !== this.authForm.confirmPassword) {
            this.authError = 'Passwords do not match'
            return
          }
          const resp = await apiPost('/api/auth/register', { email: this.authForm.email, password: this.authForm.password })
          // Auto-login after registration
          await this.handleLogin()
        } else {
          await this.handleLogin()
        }
      } catch (err) {
        this.authError = err.message || 'Authentication failed'
      } finally {
        this.authLoading = false
      }
    },

    async handleLogin() {
      try {
        const resp = await apiPost('/api/auth/login', { email: this.authForm.email, password: this.authForm.password })
        if (resp.access_token && resp.user && resp.user.id) {
          localStorage.setItem('accessToken', resp.access_token)
          this.isAuthenticated = true
          this.showLoginModal = false
          this.navigate('/dashboard')
          Alpine.store('toast').show('Login successful!', 'success')
        } else {
          this.authError = 'Invalid response from server'
        }
      } catch (err) {
        this.authError = err.message || 'Login failed'
      }
    },

    async handleCreateAccount() {
      // client-side validations
      if (this.caForm.password !== this.caForm.confirmPassword) {
        Alpine.store('toast').show('Passwords do not match', 'error')
        return
      }
      if (this.caForm.password.length < 8) {
        Alpine.store('toast').show('Password must be at least 8 characters long', 'error')
        return
      }
      if (!this.caForm.terms) {
        Alpine.store('toast').show('You must agree to the Terms of Service and Privacy Policy', 'error')
        return
      }
      this.authLoading = true
      this.authError = ''
      try {
        const resp = await apiPost('/api/auth/register', {
          email: this.caForm.email,
          password: this.caForm.password,
          name: this.caForm.name
        })
        // Auto-login after registering
        const loginResp = await apiPost('/api/auth/login', { email: this.caForm.email, password: this.caForm.password })
        if (loginResp.access_token) {
          localStorage.setItem('accessToken', loginResp.access_token)
          this.isAuthenticated = true
          Alpine.store('toast').show('Account created successfully!', 'success')
          this.navigate('/dashboard')
        }
      } catch (err) {
        this.authError = err.message || 'Account creation failed'
        Alpine.store('toast').show(this.authError, 'error')
      } finally {
        this.authLoading = false
      }
    },

    // ── Connection Health ──
    isConnected: false,
    async checkHealth() {
      try {
        const r = await fetch('/health', { signal: AbortSignal.timeout(5000) })
        this.isConnected = r.ok
      } catch (e) {
        this.isConnected = false
      }
    },

    // ── Widget State ──
    showUserMenu: false,
    widgetStates: loadWidgetStates(),

    toggleWidget(name) {
      const w = this.widgetStates[name]
      if (w) {
        const wasMinimized = w.minimized
        w.minimized = !w.minimized
        saveWidgetStates(this.widgetStates)
        // Re-fetch data when expanding a widget if authenticated
        if (wasMinimized && this.isAuthenticated) {
          if (name === 'dividends') this.loadDividends()
        }
      }
    },

    // ── Portfolio ──
    portfolioLoading: false,
    portfolioError: '',
    positions: [],
    portfolioCash: 0,
    portfolioBTCDollar: 0,
    btcAvgBuyPrice: 0,
    lastUpdated: '',
    sortCol: 'percent',
    sortDir: 'desc',
    // Portfolio view settings (persisted)
    portfolioViewSettings: { columns: {}, defaultSortCol: 'percent', defaultSortDir: 'desc' },
    showPortfolioViewSettings: false,
    availableSymbols: [],
    availableStrategies: [],

    get sortedPositions() {
      const totalValue = this.positions.reduce((s, p) => s + (p.market_value || 0), 0) + this.portfolioCash + this.portfolioBTCDollar

      // Build CASH position
      const cashPos = this.portfolioCash > 0 ? {
        symbol: 'CASH', id: 'cash', amount: this.portfolioCash,
        market_value: this.portfolioCash, percent_of_portfolio: totalValue > 0 ? (this.portfolioCash / totalValue) * 100 : 0,
        todays_return: 0, total_return: 0, total_return_percent: 0,
        beta: 0, delta: 0, notes: '$' + this.portfolioCash.toFixed(2), is_cash: true
      } : null

      // Build BTC position
      const btcQty = this.btcAvgBuyPrice > 0 ? this.portfolioBTCDollar / this.btcAvgBuyPrice : 0
      const btcPos = this.portfolioBTCDollar > 0 ? {
        symbol: 'BTC', id: 'btc', amount: this.portfolioBTCDollar,
        avg_buy_price: this.btcAvgBuyPrice, market_value: this.portfolioBTCDollar,
        percent_of_portfolio: totalValue > 0 ? (this.portfolioBTCDollar / totalValue) * 100 : 0,
        todays_return: 0, total_return: 0, total_return_percent: 0,
        beta: 0, delta: 0, notes: btcQty > 0 ? '\u0243' + btcQty.toFixed(8) : '', is_btc: true, is_crypto: true
      } : null

      // Process other positions
      const other = this.positions
        .filter(p => p.symbol !== 'BTC')
        .map(p => ({
          ...p,
          percent_of_portfolio: totalValue > 0 ? ((p.market_value || 0) / totalValue) * 100 : 0,
          notes: p.symbol === 'BTC' && this.btcAvgBuyPrice > 0 && this.portfolioBTCDollar > 0
            ? '\u0243' + (this.portfolioBTCDollar / this.btcAvgBuyPrice).toFixed(8)
            : (p.notes || '')
        }))

      // Sort other positions
      const sorted = [...other].sort((a, b) => {
        let av = a[this.sortCol === 'amount' ? 'quantity' : this.sortCol === 'buy_price' ? 'avg_buy_price' : this.sortCol === 'todays_return' && !(a.todays_return) ? 'total_return' : this.sortCol] || 0
        let bv = b[this.sortCol === 'amount' ? 'quantity' : this.sortCol === 'buy_price' ? 'avg_buy_price' : this.sortCol === 'todays_return' && !(b.todays_return) ? 'total_return' : this.sortCol] || 0
        return this.sortDir === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1)
      })

      const result = []
      if (cashPos) result.push(cashPos)
      if (btcPos) result.push(btcPos)
      result.push(...sorted)
      return result
    },

    sortBy(col) {
      if (this.sortCol === col) {
        this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc'
      } else {
        this.sortCol = col
        this.sortDir = 'desc'
      }
    },

    async fetchPortfolio() {
      if (!this.isAuthenticated) return
      this.portfolioLoading = true
      this.portfolioError = ''
      try {
        const summary = await apiGet('/api/portfolio/summary')
        this.positions = (summary.positions || []).map(p => ({ 
          ...p,
          amount: p.amount ?? 0,
          avg_buy_price: p.avg_buy_price ?? 0,
          current_price: p.current_price ?? 0,
          todays_return: p.todays_return ?? 0,
          total_return: p.total_return ?? 0,
          total_return_percent: p.total_return_percent ?? 0,
          percent_of_portfolio: p.percent_of_portfolio ?? 0,
          market_value: p.market_value ?? 0
        }))
        this.lastUpdated = new Date().toLocaleString()
        // Derive available symbols from positions
        this.availableSymbols = [...new Set(this.positions.map(p => p.symbol).filter(Boolean))]
        try {
          const settings = await apiGet('/api/portfolio/settings')
          this.portfolioCash = settings.total_portfolio_cash || 0
          this.portfolioBTCDollar = settings.total_portfolio_btc || 0
          this.btcAvgBuyPrice = settings.btc_avg_buy_price || 0
        } catch (e) {
          this.portfolioCash = 0
          this.portfolioBTCDollar = 0
          this.btcAvgBuyPrice = 0
        }
        // Load secondary dashboard data in parallel
        await Promise.allSettled([
          this.loadDividends()
        ])
      } catch (err) {
        this.portfolioError = err.message || 'Failed to load portfolio'
      } finally {
        this.portfolioLoading = false
      }
    },

    // ── Portfolio: Add/Edit Position Modal ──
    showPosModal: false,
    editingPos: null,
    posForm: { id: null, symbol: '', amount: 0, avg_buy_price: 0, notes: '' },

    openAddPositionModal(pos) {
      if (pos) {
        this.editingPos = pos
        this.posForm = { ...pos }
      } else {
        this.editingPos = null
        this.posForm = { id: null, symbol: '', amount: 0, avg_buy_price: 0, notes: '' }
      }
      this.showPosModal = true
    },
    editPosition(pos) { this.openAddPositionModal(pos) },
    async savePosition() {
      try {
        if (this.editingPos) {
          // Update via API or local
          const idx = this.positions.findIndex(p => p.id === this.editingPos.id)
          if (idx >= 0) this.positions[idx] = { ...this.posForm, id: this.editingPos.id }
        } else {
          this.positions.unshift({ ...this.posForm, id: Date.now(), source: 'manual', is_crypto: false })
        }
        this.showPosModal = false
        Alpine.store('toast').show('Position ' + (this.editingPos ? 'updated' : 'added') + ' successfully', 'success')
      } catch (err) {
        Alpine.store('toast').show('Failed to save position', 'error')
      }
    },
    deletePosition(pos) {
      this.positions = this.positions.filter(p => p.id !== pos.id)
      Alpine.store('toast').show('Position deleted', 'success')
    },

    // ── Portfolio: Settings Modal ──
    showSettingsModal: false,
    // ── Sync (async background) ──
    syncStatus: null,           // "running"/"done"/"error"/null
    syncProgress: '',
    syncId: null,
    syncError: '',
    syncStartTime: null,        // timestamp ms
    syncElapsed: 0,             // seconds elapsed counter
    syncElapsedTimer: null,     // setInterval handle for elapsed ticker
    syncPollInterval: null,     // setInterval handle for polling
    lastSyncTime: null,         // timestamp ms of last successful sync
    settingsForm: { cash: '0', btc_dollar: '0', btc_avg_price: '0', robinhood_enabled: false, robinhood_username: '', robinhood_password: '', robinhood_mfa: '' },

    // ── Portfolio: View Settings ──
    openPortfolioViewSettings() {
      const saved = localStorage.getItem('portfolioViewSettings')
      if (saved) {
        try { this.portfolioViewSettings = JSON.parse(saved) } catch (e) {}
      }
      // Ensure all columns exist
      const defaults = {
        symbol: true, notes: true, avgBuyPrice: true, percent: true,
        todaysReturn: true, totalReturn: true, totalReturnPct: true, marketValue: true
      }
      if (!this.portfolioViewSettings.columns) this.portfolioViewSettings.columns = {}
      for (const [k, v] of Object.entries(defaults)) {
        if (this.portfolioViewSettings.columns[k] === undefined) {
          this.portfolioViewSettings.columns[k] = v
        }
      }
      this.showPortfolioViewSettings = true
    },
    savePortfolioViewSettings() {
      localStorage.setItem('portfolioViewSettings', JSON.stringify(this.portfolioViewSettings))
      this.sortCol = this.portfolioViewSettings.defaultSortCol
      this.sortDir = this.portfolioViewSettings.defaultSortDir
      this.showPortfolioViewSettings = false
      Alpine.store('toast').show('View settings saved', 'success')
    },

    async openSettingsModal() {
      try {
        const s = await apiGet('/api/portfolio/settings')
        this.settingsForm = {
          cash: (s.total_portfolio_cash || 0).toString(),
          btc_dollar: (s.total_portfolio_btc || 0).toString(),
          btc_avg_price: (s.btc_avg_buy_price || 0).toString(),
          robinhood_enabled: s.robinhood_enabled || false,
          robinhood_username: s.robinhood_username || '',
          robinhood_password: s.robinhood_password || '',
          robinhood_mfa: s.robinhood_mfa || ''
        }
      } catch (e) {
        this.settingsForm = {
          cash: (this.portfolioCash || 0).toString(),
          btc_dollar: (this.portfolioBTCDollar || 0).toString(),
          btc_avg_price: (this.btcAvgBuyPrice || 0).toString(),
          robinhood_enabled: false,
          robinhood_username: '', robinhood_password: '', robinhood_mfa: ''
        }
      }
      this.showSettingsModal = true
    },

    async saveSettings() {
      // Validate
      const cash = parseFloat(this.settingsForm.cash)
      const btc = parseFloat(this.settingsForm.btc_dollar)
      const btcPrice = parseFloat(this.settingsForm.btc_avg_price)
      if (isNaN(cash) || isNaN(btc) || isNaN(btcPrice)) {
        Alpine.store('toast').show('Invalid number values', 'error')
        return
      }
      try {
        const result = await apiPut('/api/portfolio/settings', {
          total_portfolio_cash: cash,
          total_portfolio_btc: btc,
          btc_avg_buy_price: btcPrice,
          robinhood_enabled: this.settingsForm.robinhood_enabled,
          robinhood_username: this.settingsForm.robinhood_username.trim() || null,
          robinhood_password: this.settingsForm.robinhood_password.trim() || null,
          robinhood_mfa: this.settingsForm.robinhood_mfa.trim() || null
        })
        this.portfolioCash = cash
        this.portfolioBTCDollar = btc
        this.btcAvgBuyPrice = btcPrice
        this.showSettingsModal = false
        Alpine.store('toast').show('Settings saved successfully', 'success')
      } catch (err) {
        Alpine.store('toast').show(err.message || 'Failed to save settings', 'error')
      }
    },

    stopSyncPolling() {
      if (this.syncPollInterval) { clearInterval(this.syncPollInterval); this.syncPollInterval = null }
      if (this.syncElapsedTimer) { clearInterval(this.syncElapsedTimer); this.syncElapsedTimer = null }
    },
    async syncFromSettings() {
      const startTime = Date.now()
      this.syncStatus = 'running'
      this.syncProgress = 'Starting sync...'
      this.syncId = null
      this.syncError = ''
      this.syncStartTime = startTime
      this.syncElapsed = 0
      try {
        // Step 1: Start background sync
        const resp = await apiPost('/api/workflows/sync-start', undefined, 10000)
        const syncId = resp.sync_id
        this.syncId = syncId

        // Step 2: Start elapsed timer
        this.syncElapsedTimer = setInterval(() => {
          this.syncElapsed = Math.floor((Date.now() - this.syncStartTime) / 1000)
        }, 1000)

        // Step 3: Poll every 3s for status
        const timeoutMs = 300000  // 5 min
        this.syncPollInterval = setInterval(async () => {
          if (Date.now() - startTime > timeoutMs) {
            this.stopSyncPolling()
            this.syncStatus = 'error'
            this.syncError = 'Sync timed out after 5 minutes'
            Alpine.store('toast').show('Sync timed out — try again', 'error')
            return
          }
          try {
            const statusResp = await apiGet('/api/workflows/sync-status/' + syncId)
            this.syncProgress = statusResp.progress || 'Syncing...'
            if (statusResp.status === 'done') {
              this.stopSyncPolling()
              this.syncStatus = 'done'
              this.lastSyncTime = Date.now()
              await this.fetchPortfolio()
              const posCount = this.positions.length
              Alpine.store('toast').show('Sync complete — ' + posCount + ' positions loaded', 'success')
            } else if (statusResp.status === 'error') {
              this.stopSyncPolling()
              this.syncStatus = 'error'
              this.syncError = statusResp.error || 'Sync failed'
              this.syncProgress = statusResp.progress || 'Sync error'
              Alpine.store('toast').show(this.syncError, 'error')
            }
          } catch (pollErr) {
            // Swallow poll errors — let the next tick retry
            console.warn('Sync poll error:', pollErr)
          }
        }, 3000)
      } catch (err) {
        this.stopSyncPolling()
        this.syncStatus = 'error'
        this.syncError = err.message || 'Failed to start sync'
        this.syncProgress = 'Sync failed'
        Alpine.store('toast').show(this.syncError, 'error')
      }
    },

    // ── Dividends + DCA ──
    dividends: [],
    dividendsLoading: false,
    divTab: 'history',
    // DCA state
    dcaLoading: false,
    dcaShares: 0,
    dcaAvgPrice: 0,
    dcaMktVal: 0,
    dcaMonthlyDiv: 0,
    dcaDaily: 2000,
    dcaTargetPrice: 35,
    dcaDays: 365,
    hideLowDivSymbols: true,

    get dcaMonthlyShares() {
      return this.dcaAvgPrice > 0 ? this.dcaMonthlyDiv / this.dcaAvgPrice : 0
    },
    get dcaYearShares() {
      return this.dcaMonthlyShares * 12
    },
    get dcaYearPct() {
      return this.dcaShares > 0 ? (this.dcaYearShares / this.dcaShares) * 100 : 0
    },
    get dcaTotalInvested() {
      return this.dcaDaily * this.dcaDays
    },
    get dcaSimShares() {
      return this.dcaTargetPrice > 0 ? this.dcaTotalInvested / this.dcaTargetPrice : 0
    },
    get dcaSimFinalVal() {
      return this.dcaSimShares * this.dcaTargetPrice
    },
    get dcaSimProfit() {
      return this.dcaSimFinalVal - this.dcaTotalInvested
    },
    get divTotalAll() {
      return this.dividends.reduce((s, d) => s + (d.amount || 0), 0)
    },
    get divTotalYear() {
      const y = new Date().getFullYear().toString()
      return this.dividends
        .filter(d => (d.date || '').startsWith(y))
        .reduce((s, d) => s + (d.amount || 0), 0)
    },
    get divCount() {
      return this.dividends.length
    },
    get divBySymbol() {
      const map = {}
      for (const d of this.dividends) {
        const sym = d.symbol
        if (!map[sym]) map[sym] = { symbol: sym, total: 0, count: 0 }
        map[sym].total += d.amount || 0
        map[sym].count++
      }
      return Object.values(map).sort((a, b) => b.total - a.total)
    },
    get divBySymbolFiltered() {
      const all = this.divBySymbol
      if (this.hideLowDivSymbols) {
        return all.filter(s => s.total >= 1000)
      }
      return all
    },

    async loadDividends() {
      this.dividendsLoading = true
      this.dcaLoading = true
      try {
        const [data, portfolio] = await Promise.allSettled([
          apiGet('/api/dividends/'),
          apiGet('/api/portfolio/summary')
        ])
        if (data.status === 'fulfilled') {
          this.dividends = Array.isArray(data.value) ? data.value : []
        }
        if (portfolio.status === 'fulfilled') {
          const btci = (portfolio.value.positions || []).find(p => p.symbol === 'BTCI')
          if (btci) {
            this.dcaShares = btci.amount || 0
            this.dcaAvgPrice = btci.avg_buy_price || 0
            this.dcaMktVal = btci.market_value || 0
          }
          // Calculate median monthly dividend from last 6 months (resists spikes)
          const now = new Date()
          const sixMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 6, 1)
          const recentDivs = this.dividends.filter(d => {
            const dt = new Date(d.date || d.payable_date)
            return dt >= sixMonthsAgo
          })
          // Group by month and take median
          const monthTotals = {}
          for (const d of recentDivs) {
            const m = (d.date || d.payable_date || '').slice(0, 7)
            if (m) monthTotals[m] = (monthTotals[m] || 0) + (d.amount || 0)
          }
          const vals = Object.values(monthTotals).sort((a, b) => a - b)
          const n = vals.length
          this.dcaMonthlyDiv = n > 0
            ? n % 2 === 0 ? (vals[n/2 - 1] + vals[n/2]) / 2 : vals[Math.floor(n/2)]
            : 0
        }
      } catch (err) {
        Alpine.store('toast').show('Failed to load dividends', 'error')
      } finally {
        this.dividendsLoading = false
        this.dcaLoading = false
      }
    },

    // ── Reports ──
    reports: [],
    reportsLoading: false,
    reportGenerating: false,
    generatingElapsed: 0,
    reportError: '',
    reportFilters: { type: 'all', symbol: 'all', strategy: 'all', startDate: '', endDate: '' },
    genForm: { reportType: 'market', symbol: '', strategy: 'BuyAndHoldStrategy', timeframe: 'Daily', startDate: '', endDate: '' },
    symbolQuery: '',
    symbolSuggestions: [],
    symbolDropdownOpen: false,
    symbolDropdownIndex: -1,
    symbolSearching: false,
    symbolSearchHint: '',
    symbolSearchError: '',
    _genTimer: null,
    _symbolTimer: null,
    availableStrategies: ['SMA','EMA','RSI','MACD','Buy & Hold'],

    get availableReportTypes() {
      return REPORT_TYPES.filter(t => REPORT_TYPE_CAPS[t].available).map(t => ({ value: t, label: REPORT_TYPE_CAPS[t].label }))
    },
    get hiddenReportTypes() {
      return REPORT_TYPES.filter(t => !REPORT_TYPE_CAPS[t].available).map(t => ({
        value: t, label: REPORT_TYPE_CAPS[t].label,
        hint: REPORT_TYPE_CAPS[t].label + ' reports aren\'t wired to the backend yet.'
      }))
    },
    get validStrategies() { return VALID_STRATEGIES },
    showGenField(field) {
      const f = REPORT_TYPE_CAPS[this.genForm.reportType]
      return f && f.fields.includes(field)
    },

    get filteredReports() {
      const generating = this.reports.filter(r => r._is_generating)
      const rest = this.reports.filter(r => {
        if (r._is_generating) return false
        const rt = (r.reportTypeKey || (r.reportType || '').toLowerCase())
        if (this.reportFilters.type !== 'all' && rt !== this.reportFilters.type) return false
        if (this.reportFilters.symbol !== 'all' && r.symbol !== this.reportFilters.symbol) return false
        if (this.reportFilters.strategy !== 'all' && String(r.strategy) !== this.reportFilters.strategy) return false
        return true
      })
      return [...generating, ...rest]
    },

    async loadReports() {
      this.reportsLoading = true
      try {
        const data = await apiGet('/api/report/list')
        const list = Array.isArray(data) ? data : []
        this.reports = list.map(m => {
          const rawType = String(m.type || m.report_type || m.reportType || 'report').toLowerCase()
          let key = 'market', label = 'Market Check'
          if (rawType.includes('finance') || rawType.includes('financial')) { key = 'finance'; label = 'Finance' }
          else if (rawType.includes('market')) { key = 'market'; label = 'Market Check' }
          else if (rawType.includes('backtest')) { key = 'backtest'; label = 'Backtest' }
          else if (rawType.includes('comparison')) { key = 'comparison'; label = 'Comparison' }
          return {
            id: m.id || m.path || m.dir,
            symbol: m.symbol || 'MARKET',
            reportType: label,
            reportTypeKey: key,
            strategy: m.strategy || '—',
            timeframe: m.timeframe || '—',
            dateRange: m.start_date && m.end_date ? m.start_date + ' to ' + m.end_date : (m.dateRange || '—'),
            created: m.created ? new Date(String(m.created).replace(' ', 'T')) : new Date(),
            dir: m.dir || null,
            path: m.path || (m.dir ? '/static/results/' + m.dir + '/index.html' : null)
          }
        })
        this.availableSymbols = [...new Set(this.reports.map(r => r.symbol).filter(s => s && s !== 'MARKET'))].sort()
        this.availableStrategies = [...new Set(this.reports.map(r => r.strategy).filter(s => s && s !== '—'))].sort()
      } catch (err) {
        this.reports = []
        Alpine.store('toast').show('Failed to load reports', 'error')
      } finally {
        this.reportsLoading = false
      }
    },

    resetFilters() {
      this.reportFilters = { type: 'all', symbol: 'all', strategy: 'all', startDate: '', endDate: '' }
    },
    applyFilters() { Alpine.store('toast').show('Filters applied', 'success') },

    openGenerateReportModal() {
      const now = new Date(), start = new Date()
      start.setFullYear(start.getFullYear() - 1)
      this.genForm = {
        reportType: 'market',
        symbol: this.reportFilters.symbol !== 'all' ? this.reportFilters.symbol : '',
        strategy: 'BuyAndHoldStrategy',
        timeframe: 'Daily',
        startDate: toISODate(start),
        endDate: toISODate(now)
      }
      this.symbolQuery = this.genForm.symbol || ''
      this.symbolSuggestions = []
      this.symbolDropdownOpen = false
      this.symbolSearchError = ''
      this.symbolSearchHint = ''
      this.showGenReportModal = true
    },
    showGenReportModal: false,

    async generateReport() {
      if (this.reportGenerating) return
      this.reportError = ''
      const snapshot = { ...this.genForm }
      this.showGenReportModal = false

      this.reportGenerating = true
      this.generatingElapsed = 0
      const skeletonId = '__gen_' + Date.now()
      this.reports.unshift({
        id: skeletonId,
        _is_generating: true,
        symbol: snapshot.symbol || '...',
        reportType: snapshot.reportType === 'market' ? 'Market Check' : 'Finance',
        reportTypeKey: snapshot.reportType,
        strategy: snapshot.strategy || '—',
        timeframe: snapshot.timeframe || '—',
        dateRange: snapshot.startDate && snapshot.endDate ? snapshot.startDate + ' to ' + snapshot.endDate : (snapshot.reportType === 'market' ? 'Latest snapshot' : '—'),
        created: new Date()
      })
      this._genTimer = setInterval(() => { this.generatingElapsed++ }, 1000)

      try {
        const params = new URLSearchParams()
        params.append('output_dir', 'public/results')
        params.append('force_refresh', 'false')
        params.append('timeframe', snapshot.timeframe || 'Daily')
        if (snapshot.symbol) params.append('symbol', snapshot.symbol)
        if (snapshot.strategy) params.append('strategy', snapshot.strategy)
        if (snapshot.startDate) params.append('start_date', snapshot.startDate)
        if (snapshot.endDate) params.append('end_date', snapshot.endDate)

        let endpoint
        if (snapshot.reportType === 'finance') {
          if (!snapshot.symbol) { throw new Error('Symbol is required for finance reports.') }
          endpoint = '/api/report/generate-finance?' + params.toString()
        } else if (snapshot.reportType === 'market') {
          endpoint = '/api/report/generate-market?' + params.toString()
        } else {
          throw new Error('Report type "' + snapshot.reportType + '" generation is not available yet')
        }

        const resp = await apiPost(endpoint)
        this.reports = this.reports.filter(r => !r._is_generating)
        await this.loadReports()

        const served = resp && resp.report_path ? this.deriveServedPath(resp.report_path) : null
        if (served) Alpine.store('toast').show((snapshot.reportType === 'market' ? 'Market report' : 'Report') + ' generated', 'success')
        else Alpine.store('toast').show('Report generated successfully', 'success')
      } catch (err) {
        this.reports = this.reports.filter(r => !r._is_generating)
        this.reportError = err.message || 'Failed to generate report'
        Alpine.store('toast').show(this.reportError, 'error')
      } finally {
        this.reports = this.reports.filter(r => !r._is_generating)
        this.reportGenerating = false
        this.generatingElapsed = 0
        if (this._genTimer) { clearInterval(this._genTimer); this._genTimer = null }
      }
    },

    deriveServedPath(reportPath) {
      if (!reportPath) return null
      let p = String(reportPath).trim().replace(/\\/g, '/')
      if (p.startsWith('public/')) p = '/static/' + p.slice('public/'.length)
      else if (!p.startsWith('/')) p = '/' + p
      return p.endsWith('index.html') ? p : null
    },

    viewReport(r) {
      Alpine.store('toast').show('Opening ' + r.reportType + ' for ' + r.symbol, 'info')
      const dir = r.dir
      const raw = r.path || (dir ? '/static/results/' + dir + '/index.html' : null)
      if (!raw) { Alpine.store('toast').show('Report HTML not available', 'error'); return }
      const url = raw.startsWith('/') ? raw : '/' + raw
      window.open(url, '_blank', 'noopener')
    },

    async deleteReport(r) {
      if (confirm('Delete ' + r.reportType + ' report for ' + r.symbol + '?')) {
        try {
          if (r.dir) await apiPost('/api/report/delete/' + encodeURIComponent(r.dir))
          await this.loadReports()
          Alpine.store('toast').show('Report deleted successfully', 'success')
        } catch (err) {
          Alpine.store('toast').show(err.message || 'Failed to delete report', 'error')
        }
      }
    },

    async cleanResults() {
      if (confirm('Clean all results? This cannot be undone.')) {
        try {
          await apiPost('/api/report/clean')
          await this.loadReports()
          Alpine.store('toast').show('Results cleaned successfully', 'success')
        } catch (err) {
          Alpine.store('toast').show(err.message || 'Failed to clean results', 'error')
        }
      }
    },

    // ── Symbol Search (Polygon) ──
    onSymbolInput() {
      if (this._symbolTimer) clearTimeout(this._symbolTimer)
      this.symbolSuggestions = []
      this.symbolDropdownOpen = false
      this.symbolSearchHint = ''
      this.symbolSearchError = ''
      this._symbolTimer = setTimeout(() => this.searchSymbols(this.symbolQuery.trim()), 300)
    },

    async searchSymbols(q) {
      if (q.length < 1) { this.symbolDropdownOpen = false; return }
      this.symbolSearching = true
      try {
        const results = await apiGet('/api/report/search-symbols?query=' + encodeURIComponent(q))
        this.symbolSuggestions = Array.isArray(results) ? results : []
        this.symbolDropdownIndex = -1
        if (this.symbolSuggestions.length) {
          this.symbolDropdownOpen = true
        } else {
          this.symbolDropdownOpen = false
          this.symbolSearchHint = 'No approved symbols match "' + q + '".'
        }
      } catch (err) {
        this.symbolDropdownOpen = false
        this.symbolSearchError = 'Symbol search failed. You can type a symbol manually.'
      } finally {
        this.symbolSearching = false
      }
    },

    selectSymbol(item) {
      this.symbolQuery = item.symbol
      this.genForm.symbol = item.symbol
      this.symbolDropdownOpen = false
      this.symbolSuggestions = []
    },
    onSymbolKeydown(e) {
      const n = this.symbolSuggestions.length
      if (!this.symbolDropdownOpen || n === 0) { if (e.key === 'Escape') this.symbolDropdownOpen = false; return }
      if (e.key === 'ArrowDown') { e.preventDefault(); this.symbolDropdownIndex = (this.symbolDropdownIndex + 1) % n }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.symbolDropdownIndex = (this.symbolDropdownIndex - 1 + n) % n }
      else if (e.key === 'Enter' && this.symbolDropdownIndex >= 0) { e.preventDefault(); this.selectSymbol(this.symbolSuggestions[this.symbolDropdownIndex]) }
      else if (e.key === 'Escape') this.symbolDropdownOpen = false
    },
    onSymbolBlur() { setTimeout(() => { this.symbolDropdownOpen = false }, 150) }
  }
}
</script>
