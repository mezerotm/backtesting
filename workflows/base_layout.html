<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GreenArrow Labs Backtest{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/static/site.webmanifest">
    <link rel="icon" href="/assets/icons/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" type="image/x-icon">
    
    <!-- Dark mode initialization script -->
    <script>
        // Force dark mode by default
        document.querySelector('html').classList.add('dark');
    </script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base styling */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;  /* slate-900 */
            color: #f8fafc;  /* slate-50 */
        }
    </style>
    
    {% block additional_styles %}
    <!-- Additional styles will be added by child templates -->
    {% endblock %}
</head>
<body class="flex flex-col min-h-screen bg-slate-900">
    <!-- Header with bottom border and lighter background -->
    <header class="px-6 py-4 border-b site-header border-slate-700 bg-slate-800">
        <div class="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <div class="flex gap-4 items-center">
                    <a href="/" class="flex gap-3 items-center text-2xl font-bold text-white">
                        <img src="/assets/icons/favicon-32x32.png" alt="GreenArrow Labs Logo" class="w-10 h-10">
                        GreenArrow Labs
                    </a>
                </div>
                <div class="flex gap-4 items-center">
                    {% block header_actions %}{% endblock %}
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="flex-grow py-6">
        <div class="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
            {% block content %}
            <!-- Content will be inserted here by child templates -->
            {% endblock %}
        </div>
    </main>
    
    <!-- Footer with top border and lighter background -->
    <footer class="px-6 py-4 border-t site-footer border-slate-700 bg-slate-800">
        <div class="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col gap-4 justify-between items-center md:flex-row">
                <div class="text-sm text-slate-400">
                    &copy; {{ current_year }} GreenArrow Labs. All rights reserved.
                </div>

            </div>
        </div>
    </footer>
    
    <!-- Preline UI JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    
    {% block scripts %}
    <!-- Additional scripts can be added by child templates -->
    {% endblock %}
</body>
</html>
