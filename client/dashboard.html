<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenArrow Labs - Trading Strategy Suite</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Preline UI CSS - imported via main.js -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline@2.0.3/dist/preline.css"> -->
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        'slate': {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col">
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-green-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-white text-lg">Loading GreenArrow Labs...</p>
        </div>
    </div>
    <!-- Header with bottom border and lighter background -->
    <header class="site-header py-4 px-6 border-b border-slate-700 bg-slate-800">
        <div class="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <a href="/landing.html" class="flex items-center gap-3 text-2xl font-bold text-white">
                        <img src="/favicon-32x32.png" alt="GreenArrow Labs Logo" class="w-10 h-10">
                        GreenArrow Labs
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Login Button -->
                    <button id="loginBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                        <i class="fas fa-sign-in-alt"></i>
                        <span id="loginBtnText">Login</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="flex-grow py-6">
        <div class="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="h-full">
                <!-- Portfolio Widget Section -->
                <div class="max-w-[85rem] mx-auto w-full">
                    <div id="portfolio-widget"></div>
                </div>
                <!-- Divider -->
                <div class="max-w-[85rem] mx-auto w-full flex justify-center py-2">
                    <div class="border-t border-slate-700 w-full"></div>
                </div>
                <!-- Orders Widget Section -->
                <div class="max-w-[85rem] mx-auto w-full">
                    <div id="orders-widget"></div>
                </div>
                <!-- Divider -->
                <div class="max-w-[85rem] mx-auto w-full flex justify-center py-2">
                    <div class="border-t border-slate-700 w-full"></div>
                </div>
                <!-- Dividends Widget Section -->
                <div class="max-w-[85rem] mx-auto w-full">
                    <div id="dividends-widget"></div>
                </div>
                <!-- Divider -->
                <div class="max-w-[85rem] mx-auto w-full flex justify-center py-2">
                    <div class="border-t border-slate-700 w-full"></div>
                </div>
                <!-- Profit/Loss Widget Section -->
                <div class="max-w-[85rem] mx-auto w-full">
                    <div id="profit-loss-widget"></div>
                </div>
                <!-- Divider -->
                <div class="max-w-[85rem] mx-auto w-full flex justify-center py-2">
                    <div class="border-t border-slate-700 w-full"></div>
                </div>
                <!-- Reports Area: Two Columns -->
                <div class="max-w-[85rem] mx-auto w-full">
                    <div id="report-widget"></div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-slate-800 rounded-lg p-6 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white">Login</h2>
                <button id="closeLoginModal" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                    <input type="email" id="email" name="email" required autofocus
                           class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-md text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" name="password" required 
                           class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-md text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="flex items-center justify-between">
                    <button type="submit" 
                            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition-colors">
                        Login
                    </button>
                    <button type="button" id="registerBtn" 
                            class="text-blue-400 hover:text-blue-300 text-sm">
                        Create Account
                    </button>
                </div>
            </form>
            
            <div id="loginError" class="mt-4 text-red-400 text-sm hidden"></div>
        </div>
    </div>
    
    <!-- Add toast container at the bottom of the page -->
    <div id="toast-container" class="fixed bottom-0 end-0 z-50 p-4"></div>
    
    <!-- Footer with top border and lighter background -->
    <footer class="site-footer py-4 px-6 border-t border-slate-700 bg-slate-800">
        <div class="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="text-slate-400 text-sm">
                    &copy; 2024 GreenArrow Labs. All rights reserved.
                </div>

            </div>
        </div>
    </footer>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Import our main JavaScript -->
    <script type="module" src="./src/main.js"></script>
    
    <!-- Hide loading overlay when page is ready -->
    <script>
        window.addEventListener('load', function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) {
                loadingOverlay.style.opacity = '0';
                loadingOverlay.style.transition = 'opacity 0.3s ease';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 300);
            }
        });
        
        // Also hide on DOMContentLoaded as fallback
        document.addEventListener('DOMContentLoaded', function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) {
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    loadingOverlay.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 300);
                }, 500);
            }
        });
    </script>
</body>
</html>
